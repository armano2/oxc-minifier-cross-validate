[workspace]
resolver = "3"
members = ["tasks/*"]

[workspace.lints.clippy]
all = "warn"
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# The conformance harness catches panics from individual fixtures.
[profile.dev]
panic = "unwind"
opt-level = 2
codegen-units = 256
lto = "thin"
debug-assertions = true
overflow-checks = true
